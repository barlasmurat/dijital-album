                font-size:.7rem; font-weight:700; border-radius:999px; padding:1px 7px; }

  @keyframes kaydir { from{transform:scale(1.02)} to{transform:scale(1.13)} }

let dil = 'tr';
function T(anahtar, p = {}) {
  let s = (SOZLUK[dil] && SOZLUK[dil][anahtar]) || SOZLUK.tr[anahtar] || anahtar;
  Object.keys(p).forEach(k => { s = s.split('{' + k + '}').join(p[k]); });

const $  = (s, k = document) => k.querySelector(s);

const boyut = (n) => !n ? '0 KB' : n >= 1e9 ? (n/1e9).toFixed(2)+' GB' : n >= 1e6 ? (n/1e6).toFixed(1)+' MB' : Math.max(1, Math.round(n/1e3))+' KB';
const yerelKod = () => dil === 'tr' ? 'tr-TR' : 'en-GB';

function slug(s) {
  const harita = {'ç':'c','Ç':'c','ğ':'g','Ğ':'g','ı':'i','İ':'i','ö':'o','Ö':'o','ş':'s','Ş':'s','ü':'u','Ü':'u'};
  return (s || 'album').split('').map(c => harita[c] || c).join('')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Za-z0-9 _-]/g, '').trim().replace(/\s+/g, '-').slice(0, 40) || 'album';
}

const yuklenen = {};
function kutuphaneGetir(url, kuresel) {
  if (window[kuresel]) return Promise.resolve();
  if (yuklenen[url]) return yuklenen[url];
  yuklenen[url] = new Promise((cozum, hata) => {
    const s = document.createElement('script');
    s.src = url; s.onload = cozum; s.onerror = () => hata(new Error('CDN'));
    document.head.appendChild(s);
  });
  return yuklenen[url];
}
function indir(blob, ad) {
  const adres = URL.createObjectURL(blob);
  const bag = document.createElement('a');
  bag.href = adres; bag.download = ad; bag.click();
  setTimeout(() => URL.revokeObjectURL(adres), 5000);
}

/* ---------- 3) INDEXEDDB ------------------------------------------------- */
const VT = (() => {
  let db = null;
  function ac() {
    return new Promise((cozum, hata) => {
      const istek = indexedDB.open('AniDefteriDB', 1);
      istek.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('albumler')) d.createObjectStore('albumler', {keyPath:'id'});
        if (!d.objectStoreNames.contains('medya'))    d.createObjectStore('medya',    {keyPath:'id'});
        if (!d.objectStoreNames.contains('gunluk'))   d.createObjectStore('gunluk',   {keyPath:'id'});
        if (!d.objectStoreNames.contains('ayar'))     d.createObjectStore('ayar',     {keyPath:'k'});
      };
      istek.onsuccess = () => { db = istek.result; cozum(db); };
      istek.onerror = () => hata(istek.error);
    });
  }
  const sar = (istek) => new Promise((cozum, hata) => { istek.onsuccess = () => cozum(istek.result); istek.onerror = () => hata(istek.error); });
  const depo = (ad, mod) => db.transaction(ad, mod).objectStore(ad);
  return { ac,
    getir:(d,k)=>sar(depo(d,'readonly').get(k)), hepsi:(d)=>sar(depo(d,'readonly').getAll()),
    yaz:(d,v)=>sar(depo(d,'readwrite').put(v)), sil:(d,k)=>sar(depo(d,'readwrite').delete(k)),
    bosalt:(d)=>sar(depo(d,'readwrite').clear()) };
})();
const ayarOku = async (k, v0 = null) => { const v = await VT.getir('ayar', k); return v ? v.v : v0; };
const ayarYaz = (k, v) => VT.yaz('ayar', {k, v});

const adresBellek = new Map();
const Depo = {
  mod: 'tarayici', kok: null, kokAd: '',
  destekli() { return typeof window.showDirectoryPicker === 'function' && window.isSecureContext; },
  klasorAktif() { return this.mod === 'klasor' && !!this.kok; },
  async baslat() {
    const tutamac = await ayarOku('kokKlasor', null);
    if (tutamac && this.destekli()) {
      this.kok = tutamac;
      this.kokAd = await ayarOku('kokKlasorAd', 'DigitalAlbum');
      const izin = await tutamac.queryPermission({mode: 'readwrite'});
      this.mod = izin === 'granted' ? 'klasor' : 'klasor-izinsiz';
    }
  },
  async izinIste() {
    if (!this.kok) return false;
    const izin = await this.kok.requestPermission({mode: 'readwrite'});
    if (izin === 'granted') { this.mod = 'klasor'; return true; }
    return false;
  },
  async klasorSec() {
    const ust = await window.showDirectoryPicker({mode: 'readwrite', startIn: 'pictures'});
    const kok = await ust.getDirectoryHandle('DigitalAlbum', {create: true});
    this.kok = kok; this.mod = 'klasor'; this.kokAd = ust.name + '/DigitalAlbum';
    await ayarYaz('kokKlasor', kok);
    await ayarYaz('kokKlasorAd', this.kokAd);
  },
  async benzersizKlasor(ust, istenen) {
    let ad = istenen, i = 2;
    while (true) { try { await ust.getDirectoryHandle(ad); ad = istenen + '-' + i++; } catch { return ad; } }
  },
  async benzersizDosya(dizin, istenen) {
    const n = istenen.lastIndexOf('.');
    const govde = n > 0 ? istenen.slice(0, n) : istenen, uzanti = n > 0 ? istenen.slice(n) : '';
    let ad = istenen, i = 2;
    while (true) { try { await dizin.getFileHandle(ad); ad = govde + '-' + i++ + uzanti; } catch { return ad; } }
  },
  async albumDizin(a, olustur = false) { return this.klasorAktif() ? this.kok.getDirectoryHandle(a.klasor, {create: olustur}) : null; },
  async grupDizin(a, g, olustur = false) {
    const d = await this.albumDizin(a, olustur);
    return d ? d.getDirectoryHandle(g.klasor, {create: olustur}) : null;
  },
  async fotoYaz(a, g, dosya) {
    if (this.klasorAktif()) {
      const dizin = await this.grupDizin(a, g, true);
      const ad = await this.benzersizDosya(dizin, dosya.name.replace(/[\\/:*?"<>|]/g, '-'));
      const tutamac = await dizin.getFileHandle(ad, {create: true});
      const yazici = await tutamac.createWritable();
      await yazici.write(dosya); await yazici.close();
      return {dosyaAdi: ad, boyut: dosya.size || 0};
    }
    const id = kimlik();
    await VT.yaz('medya', {id, ad: dosya.name, tip: dosya.type || '', boyut: dosya.size || 0, blob: dosya});
    return {medyaId: id, boyut: dosya.size || 0};
  },
  async fotoBlob(a, g, f) {
    if (f.medyaId) { const m = await VT.getir('medya', f.medyaId); return m ? m.blob : null; }
    if (!this.klasorAktif()) return null;
    try { const d = await this.grupDizin(a, g); return await (await d.getFileHandle(f.dosyaAdi)).getFile(); } catch { return null; }
  },
  async fotoAdres(a, g, f) {
    const anahtar = f.medyaId || (a.klasor + '/' + g.klasor + '/' + f.dosyaAdi);
    if (adresBellek.has(anahtar)) return adresBellek.get(anahtar);
    const blob = await this.fotoBlob(a, g, f);
    if (!blob) return null;
    const adres = URL.createObjectURL(blob);
    adresBellek.set(anahtar, adres);
    return adres;
  },
  async fotoSil(a, g, f) {
    const anahtar = f.medyaId || (a.klasor + '/' + g.klasor + '/' + f.dosyaAdi);
    if (adresBellek.has(anahtar)) { URL.revokeObjectURL(adresBellek.get(anahtar)); adresBellek.delete(anahtar); }
    if (f.medyaId) { await VT.sil('medya', f.medyaId); return; }
    if (!this.klasorAktif()) return;
    try { const d = await this.grupDizin(a, g); await d.removeEntry(f.dosyaAdi); } catch (e) {}
  },
  async muzikYaz(a, dosya) {
    if (this.klasorAktif()) {
      const dizin = await this.albumDizin(a, true);
      const ad = 'music.' + ((dosya.name.split('.').pop() || 'mp3').toLowerCase());
      const tutamac = await dizin.getFileHandle(ad, {create: true});
      const yazici = await tutamac.createWritable();
      await yazici.write(dosya); await yazici.close();
      return {dosyaAdi: ad, ad: dosya.name, boyut: dosya.size || 0};
    }
    const id = kimlik();
    await VT.yaz('medya', {id, ad: dosya.name, tip: dosya.type || '', boyut: dosya.size || 0, blob: dosya});
    return {medyaId: id, ad: dosya.name, boyut: dosya.size || 0};
  },
  async muzikAdres(a) {
    if (!a.muzik) return null;
    if (a.muzik.dis) return a.muzik.dis;
    if (a.muzik.medyaId) { const m = await VT.getir('medya', a.muzik.medyaId); return m ? URL.createObjectURL(m.blob) : null; }
    if (!this.klasorAktif()) return null;
    try { const d = await this.albumDizin(a); return URL.createObjectURL(await (await d.getFileHandle(a.muzik.dosyaAdi)).getFile()); } catch { return null; }
  },
  async albumYaz(a) {
    const kopya = JSON.parse(JSON.stringify(a));
    if (this.klasorAktif()) {
      const dizin = await this.albumDizin(a, true);
      const tutamac = await dizin.getFileHandle('album.json', {create: true});
      const yazici = await tutamac.createWritable();
      await yazici.write(JSON.stringify(kopya, null, 2)); await yazici.close();
      return;
    }
    await VT.yaz('albumler', kopya);
  },
  async albumSil(a) {
    if (this.klasorAktif()) { try { await this.kok.removeEntry(a.klasor, {recursive: true}); } catch (e) {} return; }
    await VT.sil('albumler', a.id);
  },
  async grupKlasorSil(a, g) {
    if (!this.klasorAktif()) return;
    try { const d = await this.albumDizin(a); await d.removeEntry(g.klasor, {recursive: true}); } catch (e) {}
  },
  async albumleriOku() {
    if (this.klasorAktif()) {
      const cikti = [];
      for await (const [ad, tutamac] of this.kok.entries()) {
        if (tutamac.kind !== 'directory' || ad === 'exports') continue;
        try {
          const dosya = await (await tutamac.getFileHandle('album.json')).getFile();
          const a = JSON.parse(await dosya.text());
          a.klasor = ad; cikti.push(a);
        } catch (e) {}
      }
      return cikti.sort((x, y) => x.olusturuldu - y.olusturuldu);
    }
    return (await VT.hepsi('albumler')).sort((x, y) => x.olusturuldu - y.olusturuldu);
  },
  async ciktiKaydet(adDosya, blob) {
    if (!this.klasorAktif()) return false;
    try {
      const dizin = await this.kok.getDirectoryHandle('exports', {create: true});
      const tutamac = await dizin.getFileHandle(adDosya, {create: true});
      const yazici = await tutamac.createWritable();
      await yazici.write(blob); await yazici.close();
      return true;
    } catch { return false; }
  }
};

async function blobVeriAdresi(blob, enBuyukKenar = 1600, kalite = .85) {
  if (!blob) return null;
  let resim;
  try { resim = await createImageBitmap(blob); } catch { return null; }
  const olcek = Math.min(1, enBuyukKenar / Math.max(resim.width, resim.height));
  const g = Math.round(resim.width * olcek), y = Math.round(resim.height * olcek);
  const tuval = document.createElement('canvas');
  tuval.width = g; tuval.height = y;
  const bg = tuval.getContext('2d');
  bg.fillStyle = '#000'; bg.fillRect(0, 0, g, y);
  bg.drawImage(resim, 0, 0, g, y);
  resim.close && resim.close();
  return {veri: tuval.toDataURL('image/jpeg', kalite), g, y};
}
function yaziGorseli(satirlar, {genislik = 2200, punto = 46, renk = '#2F2A35', hiza = 'left', kalin = false, aralik = 1.35} = {}) {
  const tuval = document.createElement('canvas');
  let bg = tuval.getContext('2d');
  const yazitipi = `${kalin ? '700' : '400'} ${punto}px Nunito, Arial, sans-serif`;
  bg.font = yazitipi;
  const dolgu = 10, sinir = genislik - dolgu * 2, cikti = [];
  satirlar.filter(Boolean).forEach(satir => {
    let mevcut = '';
    satir.toString().split(/\s+/).forEach(kelime => {
      const deneme = mevcut ? mevcut + ' ' + kelime : kelime;
      if (bg.measureText(deneme).width > sinir && mevcut) { cikti.push(mevcut); mevcut = kelime; } else mevcut = deneme;
    });
    cikti.push(mevcut);
  });
  tuval.width = genislik;
  tuval.height = Math.max(1, Math.ceil(cikti.length * punto * aralik) + dolgu * 2);
  bg = tuval.getContext('2d');
  bg.font = yazitipi; bg.fillStyle = renk; bg.textBaseline = 'top';
  cikti.forEach((satir, i) => {
    const x = hiza === 'center' ? (genislik - bg.measureText(satir).width) / 2 : dolgu;
    bg.fillText(satir, x, dolgu + i * punto * aralik);
  });
  return {veri: tuval.toDataURL('image/png'), g: tuval.width, y: tuval.height};
}

        ${durum.etiketler.map(e => `<option value="${e.id}">🏷️ ${kacan(e.ad)} (${etiketKullanan(e.id).length})</option>`).join('')}
      </select>
      <button class="btn btn-yan w-full justify-center mb-2" data-menu="etiketSil">${T('etiket_sil_btn')}</button>`
      : `<p class="text-soluk text-xs mb-2">${T('etiket_yok')}</p>`}
    <button class="btn btn-yan w-full justify-center" data-menu="etiketEkle">${T('etiket_ekle')}</button>
    <hr class="border-cizgi my-3">

    <p class="font-semibold mb-1">${T('menu_depo')}</p>
    <div class="mb-1">${depoBolum}</div>
    <p class="text-soluk text-xs mb-1">${T(Depo.klasorAktif() ? 'veri_aciklama_klasor' : 'veri_aciklama_tarayici')}</p>
    <p id="depoBilgi" class="text-xs font-semibold mb-3"></p>
    <hr class="border-cizgi my-3">

    <p class="font-semibold mb-1">${T('menu_yedek')}</p>
    <div class="flex flex-col gap-2">
      <button class="btn btn-yan justify-center" data-menu="yedekAl">${T('yedek_al')}</button>
      <button class="btn btn-yan justify-center" data-menu="yedekYukle">${T('yedek_yukle')}</button>
    </div>`;
  $$('[data-menu]', p).forEach(b => b.onclick = () => menuIs(b.dataset.menu));
  depoDurumu();
}
function menuAc(ac) {
  const p = $('#menuPanel');
  const acik = ac === undefined ? p.classList.contains('hidden') : ac;
  p.classList.toggle('hidden', !acik);
  $('#btnMenu').setAttribute('aria-expanded', String(acik));
  if (acik) menuCiz();
}
async function menuIs(is) {
  if (is === 'kapat') return menuAc(false);
  if (is === 'dil-tr' || is === 'dil-en') {
    dil = is === 'dil-tr' ? 'tr' : 'en';
    await ayarYaz('dil', dil);
    diliUygula(); menuCiz();
    return;
  }
  if (is === 'etiketEkle') return etiketEkle();
  if (is === 'etiketSil') {
    const sec = $('#menuEtiketSec');
    if (!sec || !sec.value) return bildir(T('etiket_secilmedi'), 'hata');
    menuAc(false); return etiketSilPencereAc(sec.value);
  }
  if (is === 'yedekAl')    { menuAc(false); return yedekAl(); }
  if (is === 'yedekYukle') { menuAc(false); return yedekYukle(); }
  if (is === 'izin') {
    const ok = await Depo.izinIste();
    if (!ok) return bildir(T('izin_gerekli'), 'hata');
    durum.albumler = await Depo.albumleriOku();
    if (!durum.seciliAlbum && durum.albumler[0]) durum.seciliAlbum = durum.albumler[0].id;
    diliUygula(); menuCiz();
    return;
  }
  if (is === 'sec') {
    try {
      const oncekiler = durum.albumler.slice();
      const tarayicidaydi = !Depo.klasorAktif();
      await Depo.klasorSec();
      if (tarayicidaydi && oncekiler.length && confirm(T('tasima_soru', {n: oncekiler.length}))) {
        bekle(T('tasiniyor'));
        for (const a of oncekiler) await albumuKlasoreTasi(a);
        await VT.bosalt('albumler'); await VT.bosalt('medya');
        adresBellek.clear();
        bekleKapat();
      }
      durum.albumler = await Depo.albumleriOku();
      if (!albumBul() && durum.albumler[0]) durum.seciliAlbum = durum.albumler[0].id;
      diliUygula(); menuCiz();
      bildir(T('klasor_secildi'));
    } catch (e) { if (e && e.name !== 'AbortError') bildir(T('klasor_hata'), 'hata'); }
  }
}
async function albumuKlasoreTasi(a) {
  a.klasor = await Depo.benzersizKlasor(Depo.kok, slug(a.ad));
  await Depo.kok.getDirectoryHandle(a.klasor, {create: true});
  for (const g of a.gruplar) {
    g.klasor = g.klasor || slug(g.ad);
    const dizin = await Depo.grupDizin(a, g, true);
    for (const f of g.fotograflar) {
      if (!f.medyaId) continue;
      const m = await VT.getir('medya', f.medyaId);
      if (!m) continue;
      const ad = await Depo.benzersizDosya(dizin, (m.ad || 'foto.jpg').replace(/[\\/:*?"<>|]/g, '-'));
      const tutamac = await dizin.getFileHandle(ad, {create: true});
      const yazici = await tutamac.createWritable();
      await yazici.write(m.blob); await yazici.close();
      f.dosyaAdi = ad; f.boyut = m.boyut || m.blob.size; delete f.medyaId;
    }
  }
  if (a.muzik && a.muzik.medyaId) {
    const m = await VT.getir('medya', a.muzik.medyaId);
    if (m) a.muzik = await Depo.muzikYaz(a, new File([m.blob], m.ad || 'music.mp3', {type: m.tip}));
  }
  await Depo.albumYaz(a);
}
async function depoDurumu() {
  const el = $('#depoBilgi');
  if (!el) return;
  if (Depo.klasorAktif()) { el.textContent = '📂 ' + Depo.kokAd; return; }
  if (!navigator.storage || !navigator.storage.estimate) { el.textContent = ''; return; }
  try {
    const {usage, quota} = await navigator.storage.estimate();
    el.textContent = T('depo_bilgi', {u: boyut(usage || 0), q: boyut(quota || 0)});
  } catch { el.textContent = ''; }
}

/* ---------- 7) ALBÜM LİSTESİ -------------------------------------------- */
function ekranGoster() {
  $('#ekranListe').classList.toggle('hidden', durum.ekran !== 'liste');
  $('#ekranDetay').classList.toggle('hidden', durum.ekran !== 'detay');
}
function boyutUyari(b) {
  if (b > 25e6) return {sinif:'text-pembe', metin: T('mail_cok_buyuk')};
  if (b > MAIL_SINIR) return {sinif:'text-seftali', metin: T('mail_buyuk')};
  return null;
}
function kapakFoto(a) {
  const hepsi = tumFotograflar(a);
  if (!hepsi.length) return null;
  return (a.kapak && hepsi.find(x => x.foto.id === a.kapak)) || hepsi[0];
}
function kapakYukle(kok = document) {
  $$('img[data-kapak]', kok).forEach(async img => {
    const a = durum.albumler.find(x => x.id === img.dataset.kapak);
    const k = a && kapakFoto(a);
    if (!k) return;
    const adres = await Depo.fotoAdres(a, k.grup, k.foto);
    if (adres) img.src = adres;
  });
}
async function etiketEkle() {
  const ad = await metinSor({baslik: T('etiket_adi'), ipucu: T('ornek_etiket'),
    dogrula: (v) => !v ? T('ad_gerekli') : durum.etiketler.some(e => kucuk(e.ad) === kucuk(v)) ? T('etiket_var') : null});
  if (!ad) return;
  durum.etiketler.push({id: kimlik(), ad});
  await ayarYaz('etiketler', durum.etiketler);
  menuCiz(); etiketFiltreCiz();
}
function etiketSilPencereAc(id) {
  const e = durum.etiketler.find(x => x.id === id);
  if (!e) return;
  const kullanan = etiketKullanan(id);
  $('#etiketSilBaslik').textContent = T('etiket_sil_baslik', {ad: e.ad});
  $('#etiketSilDurum').textContent = kullanan.length ? T('etiket_kullanimda') : T('etiket_bos');
  $('#etiketSilAlbumler').innerHTML = kullanan.map(a =>
    `<button class="w-full text-left rounded-xl border border-cizgi px-3 py-2 hover:bg-kagit" data-git="${a.id}">
       📁 ${kacan(a.ad)} <span class="text-xs text-soluk">→ ${T('etiket_btn')}</span></button>`).join('');
  $$('#etiketSilAlbumler [data-git]').forEach(b => b.onclick = () => {
    $('#etiketSilPencere').classList.add('hidden');
    sekmeAc('tasarim'); albumAc(b.dataset.git);
  });
  const onay = $('#etiketSilOnay');
  onay.disabled = kullanan.length > 0;
  onay.onclick = async () => {
    durum.etiketler = durum.etiketler.filter(x => x.id !== id);
    await ayarYaz('etiketler', durum.etiketler);
    if (durum.filtre === id) durum.filtre = null;
    $('#etiketSilPencere').classList.add('hidden');
    etiketFiltreCiz(); listeCiz(); menuCiz();
  };
  $('#etiketSilPencere').classList.remove('hidden');
}
function etiketSecPencereAc(a) {
  return new Promise(cozum => {
    const secili = albumEtiket(a) || '';
    $('#etiketSecBaslik').textContent = T('etiket_sec');
    $('#etiketSecAciklama').textContent = T('etiket_sec_aciklama', {ad: a.ad});
    $('#etiketSecListe').innerHTML = durum.etiketler.length
      ? `<label class="block text-sm font-semibold mb-1">${T('etiket_sec_tek')}</label>
         <select id="etiketSecAlan" class="alan">
           <option value="">${T('etiketsiz')}</option>
           ${durum.etiketler.map(e => `<option value="${e.id}" ${secili === e.id ? 'selected' : ''}>🏷️ ${kacan(e.ad)}</option>`).join('')}
         </select>`
      : `<p class="text-soluk text-sm">${T('etiket_yok')}</p>`;
    const pencere = $('#etiketSecPencere');
    pencere.classList.remove('hidden');
    function kapat(sonuc) { pencere.classList.add('hidden'); $('#etiketSecTamam').onclick = null; $('#etiketSecIptal').onclick = null; cozum(sonuc); }
    $('#etiketSecTamam').onclick = () => { const alan = $('#etiketSecAlan'); kapat(alan ? (alan.value || null) : null); };
    $('#etiketSecIptal').onclick = () => kapat(undefined);
  });
}
function etiketFiltreCiz() {
  const kutu = $('#etiketFiltre');
  kutu.classList.toggle('hidden', !durum.etiketler.length);
  if (!durum.etiketler.length) { kutu.innerHTML = ''; return; }
  const secili = durum.filtre || '';
  kutu.innerHTML = `<option value="">${T('etiket_filtre_hepsi')}</option>` +
    durum.etiketler.map(e => `<option value="${e.id}" ${secili === e.id ? 'selected' : ''}>🏷️ ${kacan(e.ad)}</option>`).join('') +
    `<option value="yok" ${secili === 'yok' ? 'selected' : ''}>${T('etiketsiz')}</option>`;
}

function listeCiz() {
  const yon = $('#albumSirala').value || 'yeni';
  const suzulmus = durum.albumler.filter(a =>
    !durum.filtre ? true : durum.filtre === 'yok' ? !albumEtiket(a) : albumEtiket(a) === durum.filtre);
  const liste = suzulmus.slice().sort((a, b) =>
      yon === 'eski'  ? a.olusturuldu - b.olusturuldu
    : yon === 'adAZ'  ? a.ad.localeCompare(b.ad, yerelKod())
    : yon === 'adZA'  ? b.ad.localeCompare(a.ad, yerelKod())
    : yon === 'buyuk' ? albumBoyut(b) - albumBoyut(a)
    : b.olusturuldu - a.olusturuldu);

  $('#listeOzet').textContent = T('ozet', {n: liste.length, b: boyut(liste.reduce((t, a) => t + albumBoyut(a), 0))});
  $$('[data-gorunum]').forEach(b => b.style.background = b.dataset.gorunum === durum.gorunum ? '#F0EEF3' : 'transparent');

  const kutu = $('#albumListe');
  if (!durum.albumler.length) {
    kutu.className = '';
    kutu.innerHTML = `<div class="bg-white rounded-3xl shadow-kart p-10 text-center">
      <h3 class="font-baslik text-xl font-semibold mb-1">${T('bos_baslik')}</h3>
      <p class="text-soluk">${T('bos_metin')}</p></div>`;

  }
  const kart = (a) => {
    const n = tumFotograflar(a).length, b = albumBoyut(a), u = boyutUyari(b);
    return `<button data-ac="${a.id}" class="text-left bg-white rounded-3xl shadow-kart hover:shadow-kalk transition overflow-hidden">
      <div class="aspect-[4/3] bg-kagit p-2"><img data-kapak="${a.id}" alt="" class="w-full h-full object-contain rounded-xl"></div>
      <div class="p-4">
        <h3 class="font-baslik text-lg font-semibold leading-tight">${kacan(a.ad)}</h3>
        ${a.ithaf ? `<p class="text-xs italic text-lila truncate">🎁 ${kacan(a.ithaf)}</p>` : ''}
        ${etiketAdi(albumEtiket(a)) ? `<p class="text-xs text-soluk truncate">🏷️ ${kacan(etiketAdi(albumEtiket(a)))}</p>` : ''}
        <p class="text-xs text-soluk mt-1">${T('olusturuldu', {tarih: kisaTarih(a.olusturuldu)})}</p>
        <p class="text-sm mt-1">${T('foto_sayi', {n})} · ${T('grup_sayi', {n: a.gruplar.length})} · ${boyut(b)}</p>
        ${u ? `<p class="text-xs font-semibold ${u.sinif} mt-1">${u.metin}</p>` : ''}
      </div></button>`;
  };
  const satir = (a) => {
    const n = tumFotograflar(a).length, b = albumBoyut(a), u = boyutUyari(b);
    return `<button data-ac="${a.id}" class="w-full text-left bg-white rounded-2xl shadow-kart hover:shadow-kalk transition p-3 flex items-center gap-3">
      <div class="w-16 h-14 rounded-xl bg-kagit shrink-0 p-1"><img data-kapak="${a.id}" alt="" class="w-full h-full object-contain"></div>
      <div class="min-w-0 flex-1">
        <h3 class="font-baslik font-semibold leading-tight truncate">${kacan(a.ad)}</h3>
        <p class="text-xs text-soluk truncate">${T('olusturuldu', {tarih: kisaTarih(a.olusturuldu)})} · ${T('foto_sayi', {n})} · ${T('grup_sayi', {n: a.gruplar.length})}${a.ithaf ? ' · 🎁 ' + kacan(a.ithaf) : ''}</p>
      </div>
      <div class="text-right shrink-0"><p class="text-sm font-semibold">${boyut(b)}</p>
        ${u ? `<p class="text-[11px] font-semibold ${u.sinif}">${u.metin}</p>` : ''}</div></button>`;
  };
  kutu.className = durum.gorunum === 'izgara' ? 'grid sm:grid-cols-2 lg:grid-cols-3 gap-4' : 'space-y-2';
  kutu.innerHTML = liste.map(durum.gorunum === 'izgara' ? kart : satir).join('');
  kapakYukle(kutu);
  $$('#albumListe [data-ac]').forEach(b => b.onclick = () => albumAc(b.dataset.ac));
}
async function albumAc(id) {
  durum.seciliAlbum = id; durum.ekran = 'detay';

function listeyeDon() { durum.ekran = 'liste'; ekranGoster(); listeCiz(); }

  durum.siralayicilar = [];
  if (!a) { listeyeDon(); return; }
  const n = tumFotograflar(a).length, b = albumBoyut(a), u = boyutUyari(b), ayar = gosteriAyar(a);

  $('#albumCerceve').innerHTML = `

          ${Depo.klasorAktif() ? `<p class="text-xs text-soluk mt-1">📂 ${kacan(Depo.kokAd)}/${kacan(a.klasor)}</p>` : ''}
        </div>
        <div class="flex flex-wrap gap-2">
          <button class="btn btn-yan" data-is="ad">${T('ad_degistir')}</button>
          <button class="btn btn-yan" data-is="ithaf">${T('ithaf_btn')}</button>
          <button class="btn btn-yan" data-is="muzik">${T('muzik_btn')}</button>
          <button class="btn btn-yan" data-is="etiket">${T('etiket_btn')}</button>
          ${a.muzik ? `<button class="btn btn-sade" data-is="muzikSil">${T('muzik_kaldir')}</button>` : ''}
          <button class="btn btn-sade text-pembe" data-is="albumSil">${T('album_sil')}</button>

      </div>
      <div class="rounded-2xl border border-cizgi p-3 mt-4">

        <div class="grid sm:grid-cols-3 gap-3 items-end">
          <div>
            <label class="block text-xs font-semibold mb-1">${T('gecis_temasi')}</label>
            <select id="dTema" class="alan">
              <option value="t-fade" ${ayar.tema === 't-fade' ? 'selected' : ''}>${T('tema_fade')}</option>
              <option value="t-slide" ${ayar.tema === 't-slide' ? 'selected' : ''}>${T('tema_slide')}</option>
              <option value="t-zoom" ${ayar.tema === 't-zoom' ? 'selected' : ''}>${T('tema_zoom')}</option>
            </select>

            <label class="block text-xs font-semibold mb-1">${T('foto_suresi')}: <span id="dSureMetin">${ayar.sure}${dil === 'tr' ? ' sn' : ' s'}</span></label>

        ${g.fotograflar.map((f, j) => `
          <figure class="kare" data-foto="${f.id}">
            <img alt="" data-foto-img="${g.id}|${f.id}">
            <span class="sira">${j + 1}</span>
            <button class="silx" data-silfoto="${f.id}" title="${T('sil2')}">✕</button>
            <figcaption class="absolute bottom-1.5 left-0 right-0 text-center text-[11px] text-soluk truncate px-2">
              ${kacan(f.baslik || (f.not ? T('notlu_kisa') : T('basliksiz')))}
            </figcaption></figure>`).join('')}
      </div>
      ${g.fotograflar.length ? '' : `<p class="text-sm text-soluk">${T('grup_bos')}</p>`}
    </div>`).join('');

  $$('#grupListesi img[data-foto-img]').forEach(async img => {
    const [gid, fid] = img.dataset.fotoImg.split('|');
    const g = a.gruplar.find(x => x.id === gid);
    const f = g && g.fotograflar.find(x => x.id === fid);
    if (!f) return;
    const adres = await Depo.fotoAdres(a, g, f);
    if (adres) img.src = adres;
  });

  a.gruplar.forEach(g => {
    const kart = kutu.querySelector(`[data-grup="${g.id}"]`);
    kart.querySelector('[data-g="foto"]').onclick   = () => fotografEkle(a, g);
    kart.querySelector('[data-g="ad"]').onclick     = () => grupAdiDegistir(a, g);
    kart.querySelector('[data-g="sil"]').onclick    = () => grupSil(a, g);
    kart.querySelector('[data-g="yukari"]').onclick = () => grupTasi(a, g, -1);
    kart.querySelector('[data-g="asagi"]').onclick  = () => grupTasi(a, g, 1);
    kart.querySelectorAll('[data-silfoto]').forEach(b => b.onclick = (e) => {
      e.stopPropagation(); fotoSilDirekt(a, g, b.dataset.silfoto);
    });
    kart.querySelectorAll('[data-foto]').forEach(el => el.onclick = () => fotoAc(g.id, el.dataset.foto));
    const izgara = kart.querySelector('[data-izgara]');
    if (window.Sortable && g.fotograflar.length > 1) {
      durum.siralayicilar.push(new Sortable(izgara, {
        animation: 160, ghostClass: 'surukleniyor', delay: 120, delayOnTouchOnly: true,
        filter: '.silx', preventOnFilter: false,
        onEnd: async () => {
          const sira = Array.from(izgara.children).map(el => el.dataset.foto);
          g.fotograflar.sort((x, y) => sira.indexOf(x.id) - sira.indexOf(y.id));
          await albumKaydet(a); gruplariCiz(a);
        }
      }));
    }
  });
}

async function yeniAlbum() {

async function albumAdiDegistir(a) {

  if (!ad) return;

}
async function ithafDegistir(a) {

}
async function albumSilAksiyon(a) {
  if (!confirm(T('onay_album_sil', {ad: a.ad}))) return;
  if (!Depo.klasorAktif()) for (const x of tumFotograflar(a)) await Depo.fotoSil(a, x.grup, x.foto);

async function yeniGrup(a) {
  const ad = await metinSor({baslik: T('yeni_grup'), aciklama: T('grup_aciklama', {ad: a.ad}), ipucu: T('ornek_grup'),
    dogrula: (v) => !v ? T('ad_gerekli') : a.gruplar.some(g => kucuk(g.ad) === kucuk(v)) ? T('grup_var') : null});
  if (!ad) return;
  const g = {id: kimlik(), ad, klasor: slug(ad), olusturuldu: Date.now(), fotograflar: []};

    const dizin = await Depo.albumDizin(a, true);

async function grupAdiDegistir(a, g) {
  const ad = await metinSor({baslik: T('grup_adi'), deger: g.ad, ipucu: T('ornek_grup'),
    dogrula: (v) => !v ? T('ad_gerekli') : a.gruplar.some(x => x.id !== g.id && kucuk(x.ad) === kucuk(v)) ? T('grup_var') : null});
  if (!ad) return;
  g.ad = ad; await albumKaydet(a); detayCiz();
}
async function grupSil(a, g) {
  if (!confirm(T('onay_grup_sil', {ad: g.ad}))) return;
  if (Depo.klasorAktif()) await Depo.grupKlasorSil(a, g);
  else for (const f of g.fotograflar) await Depo.fotoSil(a, g, f);
  a.gruplar = a.gruplar.filter(x => x.id !== g.id);
  await albumKaydet(a); detayCiz(); listeCiz();
}
async function grupTasi(a, g, yon) {
  const i = a.gruplar.indexOf(g), j = i + yon;
  if (j < 0 || j >= a.gruplar.length) return;
  a.gruplar.splice(j, 0, a.gruplar.splice(i, 1)[0]);
  await albumKaydet(a); detayCiz();
}
async function fotografEkle(a, g) {
  const dosyalar = (await dosyaSec('image/*', true)).filter(d => d.type.startsWith('image/'));
  if (!dosyalar.length) return;
  bekle(T('foto_kaydediliyor', {i: 0, n: dosyalar.length}));
  let i = 0;
  for (const d of dosyalar) {
    i++; bekleMetin(T('foto_kaydediliyor', {i, n: dosyalar.length}));
    const kayit = await Depo.fotoYaz(a, g, d);
    const f = {id: kimlik(), baslik: '', tarih: '', yer: '', not: '', eklendi: Date.now(), ...kayit};
    g.fotograflar.push(f);
    if (!a.kapak) a.kapak = f.id;
  }
  await albumKaydet(a);
  bekleKapat();
  detayCiz(); listeCiz(); onizlemeCiz(); yedekHatirlat();
  bildir(T('foto_eklendi', {n: dosyalar.length}));
}

async function fotoAc(grupId, fotoId) {
  const a = albumBul(); if (!a) return;
  const g = a.gruplar.find(x => x.id === grupId);
  const f = g && g.fotograflar.find(x => x.id === fotoId);
  if (!f) return;
  durum.seciliFoto = {grupId, fotoId};
  $('#fotoBuyuk').src = (await Depo.fotoAdres(a, g, f)) || '';
  $('#fotoBaslik').value = f.baslik || '';
  $('#fotoTarih').value = f.tarih || '';
  $('#fotoYer').value = f.yer || '';
  $('#fotoNot').value = f.not || '';
  $('#fotoGrup').innerHTML = a.gruplar.map(x => `<option value="${x.id}" ${x.id === grupId ? 'selected' : ''}>${kacan(x.ad)}</option>`).join('');
  $('#fotoPencere').classList.remove('hidden');
}
function fotoKapat() { $('#fotoPencere').classList.add('hidden'); durum.seciliFoto = null; }
async function fotoKaydet() {
  const a = albumBul(), s = durum.seciliFoto; if (!a || !s) return;
  const g = a.gruplar.find(x => x.id === s.grupId);
  const i = g.fotograflar.findIndex(x => x.id === s.fotoId);
  const f = g.fotograflar[i];
  f.baslik = $('#fotoBaslik').value.trim();
  f.tarih = $('#fotoTarih').value;
  f.yer = $('#fotoYer').value.trim();
  f.not = $('#fotoNot').value.trim();
  const hedefId = $('#fotoGrup').value;
  if (hedefId !== s.grupId) {
    const hedef = a.gruplar.find(x => x.id === hedefId);
    if (Depo.klasorAktif()) {
      const blob = await Depo.fotoBlob(a, g, f);
      if (blob) {
        const yeni = await Depo.fotoYaz(a, hedef, new File([blob], f.dosyaAdi, {type: blob.type}));
        await Depo.fotoSil(a, g, f);
        f.dosyaAdi = yeni.dosyaAdi;
      }
    }
    g.fotograflar.splice(i, 1); hedef.fotograflar.push(f);
  }
  await albumKaydet(a);
  fotoKapat(); detayCiz(); onizlemeCiz();
  bildir(T('kayit_ok'));
}
async function fotoSilDirekt(a, g, fotoId) {
  const i = g.fotograflar.findIndex(x => x.id === fotoId);
  if (i < 0) return;
  const f = g.fotograflar[i];
  if (!confirm(T('onay_foto_sil'))) return;
  await Depo.fotoSil(a, g, f);
  g.fotograflar.splice(i, 1);
  if (a.kapak === f.id) a.kapak = null;
  await albumKaydet(a);
  detayCiz(); listeCiz(); onizlemeCiz();
}
async function fotoSilAksiyon() {
  const a = albumBul(), s = durum.seciliFoto; if (!a || !s) return;
  if (!confirm(T('onay_foto_sil'))) return;
  const g = a.gruplar.find(x => x.id === s.grupId);
  const i = g.fotograflar.findIndex(x => x.id === s.fotoId);
  const f = g.fotograflar[i];
  await Depo.fotoSil(a, g, f);
  g.fotograflar.splice(i, 1);
  if (a.kapak === f.id) a.kapak = null;
  await albumKaydet(a);
  fotoKapat(); detayCiz(); listeCiz();
}
async function fotoKapakYap() {
  const a = albumBul(), s = durum.seciliFoto; if (!a || !s) return;

}

let muzikAlbumId = null, onizlemeSes = null, onizlemeZaman = null, onizlemeDosya = null;

async function muzikListesiniGetir() {
  try {
    const cevap = await fetch('music/list.json', {cache: 'no-cache'});
    if (!cevap.ok) throw new Error('yok');
    const veri = await cevap.json();
    durum.muzikListesi = Array.isArray(veri) ? veri : (veri.tracks || []);
  } catch { durum.muzikListesi = []; }
  muzikKutuphaneCiz();
}
function muzikKutuphaneCiz() {
  const kutu = $('#muzikKutuphane');
  if (!kutu) return;
  const liste = durum.muzikListesi;
  if (!liste || !liste.length) {
    kutu.innerHTML = `<p class="text-soluk text-sm">${T('kutuphane_yok')}</p>`;
    return;
  }
  kutu.innerHTML = liste.map((m, i) => `
    <div class="flex items-center gap-2 rounded-2xl border border-cizgi p-2">
      <div class="min-w-0 flex-1">
        <p class="font-semibold text-sm truncate">${kacan(m.title || m.file)}</p>
        <p class="text-xs text-soluk truncate">${kacan(T('tur_' + (m.genre || 'ambient')))} — ${kacan(T('etki_' + (m.genre || 'ambient')))}</p>
      </div>
      <button class="btn btn-sade text-xs shrink-0" data-dinle="${i}">${T('dinle')}</button>
      <button class="btn btn-foto text-xs shrink-0" data-msec="${i}">${T('sec')}</button>
    </div>`).join('');
  $$('[data-dinle]', kutu).forEach(b => b.onclick = () => muzikOnizle(liste[+b.dataset.dinle], b));

function onizlemeDurdur() {
  if (onizlemeSes) { onizlemeSes.pause(); onizlemeSes = null; }
  onizlemeDosya = null;
  clearTimeout(onizlemeZaman);
  $$('[data-dinle]').forEach(b => b.textContent = T('dinle'));
}
function muzikOnizle(m, dugme) {
  const calan = onizlemeDosya === m.file;
  onizlemeDurdur();
  if (calan) return;
  onizlemeSes = new Audio('music/' + m.file);
  onizlemeDosya = m.file;
  onizlemeSes.volume = .8;
  onizlemeSes.play().catch(() => bildir(T('klasor_hata'), 'hata'));
  dugme.textContent = T('durdur');
  onizlemeZaman = setTimeout(onizlemeDurdur, 15000);
}
async function muzikKutuphanedenSec(m) {
  const a = durum.albumler.find(x => x.id === muzikAlbumId); if (!a) return;
  onizlemeDurdur();
  bekle(T('hazirlaniyor'));
  try {
    const blob = await (await fetch('music/' + m.file)).blob();
    if (a.muzik && a.muzik.medyaId) await VT.sil('medya', a.muzik.medyaId);
    a.muzik = await Depo.muzikYaz(a, new File([blob], m.file, {type: blob.type || 'audio/mpeg'}));
    a.muzik.ad = m.title || m.file;
    await albumKaydet(a);
    bekleKapat(); muzikPencereKapat(); detayCiz(); listeCiz(); onizlemeCiz();
    bildir(T('muzik_hazir'));
  } catch (e) { bekleKapat(); bildir(T('klasor_hata'), 'hata'); }
}
function muzikPencereAc(a) { muzikAlbumId = a.id; muzikKutuphaneCiz(); $('#muzikPencere').classList.remove('hidden'); }
function muzikPencereKapat() { onizlemeDurdur(); $('#muzikPencere').classList.add('hidden'); }

async function muzikDosyadan() {
  const a = durum.albumler.find(x => x.id === muzikAlbumId); if (!a) return;
  const [d] = await dosyaSec('audio/*', false);
  if (!d) return;
  bekle(T('hazirlaniyor'));
  if (a.muzik && a.muzik.medyaId) await VT.sil('medya', a.muzik.medyaId);
  a.muzik = await Depo.muzikYaz(a, d);
  await albumKaydet(a);
  bekleKapat(); muzikPencereKapat(); detayCiz(); listeCiz(); onizlemeCiz();
  bildir(T('muzik_hazir'));
}

function onizlemeCiz() {
  const sec = $('#onizlemeAlbum');

  sec.innerHTML = durum.albumler.map(a => `<option value="${a.id}" ${a.id === durum.seciliAlbum ? 'selected' : ''}>${kacan(a.ad)}</option>`).join('');

  if (!a) { kutu.innerHTML = `<p class="text-soluk">${T('album_secilmedi')}</p>`; return; }
  const fotolar = tumFotograflar(a), notlu = fotolar.filter(x => x.foto.not).length;
  const sn = fotolar.length * gosteriAyar(a).sure;
  kutu.innerHTML = `<p class="font-baslik text-lg font-semibold">${kacan(a.ad)}</p>

    <p class="text-soluk mt-1">${a.muzik ? '🎵 ' + kacan(a.muzik.ad) : T('muzik_yok')} · ⏱️ ${Math.floor(sn/60)}:${String(sn%60).padStart(2,'0')}</p>`;
}

const Gosteri = {liste: [], sira: 0, zaman: null, oynuyor: false, ses: null, mevcutEl: null, gizleZaman: null, ayar: GOSTERI_VARSAYILAN};

async function gosteriBaslat() {
  const secim = $('#onizlemeAlbum').value;
  if (secim) durum.seciliAlbum = secim;
  const a = albumBul();
  if (!a) return bildir(T('once_album'), 'hata');
  const fotolar = tumFotograflar(a);
  if (!fotolar.length) return bildir(T('foto_yok'), 'hata');

  const perde = $('#gosteri');
  perde.classList.remove('hidden');
  if (perde.requestFullscreen) perde.requestFullscreen().catch(() => {});
  $('#gosteriSahne').innerHTML = ''; $('#gosteriYazi').innerHTML = ''; $('#gosteriGrup').textContent = '';
  $('#gosteriBitti').classList.add('hidden');
  bekle(T('hazirlaniyor'));
  Gosteri.liste = [];
  for (const x of fotolar) {
    const adres = await Depo.fotoAdres(a, x.grup, x.foto);
    if (adres) Gosteri.liste.push({...x.foto, grupAdi: x.grupAdi, adres});
  }
  bekleKapat();
  if (!Gosteri.liste.length) { gosteriKapat(); return bildir(T('foto_yok'), 'hata'); }

  $('#gosteriAlbum').textContent = a.ad;
  Gosteri.ayar = gosteriAyar(a);
  Gosteri.mevcutEl = null; Gosteri.sira = 0; Gosteri.oynuyor = true;
  $('#gosteriDur').textContent = '⏸️';
  const muzik = await Depo.muzikAdres(a);
  if (muzik) {
    Gosteri.ses = new Audio(muzik);
    Gosteri.ses.loop = true; Gosteri.ses.crossOrigin = 'anonymous'; Gosteri.ses.volume = .85;
    Gosteri.ses.play().catch(() => bildir(T('muzik_ekrana_dokun'), 'bilgi'));
  }
  if (a.ithaf) {
    $('#gosteriYazi').innerHTML = `<p class="font-baslik text-2xl md:text-4xl font-semibold drop-shadow-lg">${kacan(a.ithaf)}</p>`;
    await new Promise(r => setTimeout(r, 3200));
  }
  await slaytGoster(0);
  kontrolGizleSayaci();
}
async function slaytGoster(i) {
  const oge = Gosteri.liste[i];
  if (!oge) return;
  Gosteri.sira = i;
  const tema = Gosteri.ayar.tema, sure = Gosteri.ayar.sure * 1000;
  const img = document.createElement('img');
  img.className = 'slayt ' + tema;
  img.style.setProperty('--sure', (sure + 900) + 'ms');
  img.src = oge.adres;
  $('#gosteriSahne').appendChild(img);
  requestAnimationFrame(() => requestAnimationFrame(() => img.classList.add('iceri')));
  const eski = Gosteri.mevcutEl;
  Gosteri.mevcutEl = img;
  if (eski) { eski.classList.add('disari'); setTimeout(() => eski.remove(), 900); }

  $('#gosteriGrup').textContent = '🗂️ ' + oge.grupAdi;
  const yazi = $('#gosteriYazi');
  if (Gosteri.ayar.notlar) {
    const ust = [oge.baslik, tarihMetin(oge.tarih), oge.yer ? '📍 ' + oge.yer : ''].filter(Boolean).join('  ·  ');
    yazi.innerHTML = (ust ? `<p class="font-baslik text-xl md:text-2xl font-semibold drop-shadow-lg">${kacan(ust)}</p>` : '') +
      (oge.not ? `<p class="mt-1 text-sm md:text-base text-white/85 max-w-2xl mx-auto drop-shadow">${kacan(oge.not)}</p>` : '');
  } else yazi.innerHTML = '';

  $('#gosteriSayac').textContent = `${i + 1} / ${Gosteri.liste.length}`;
  const cubuk = $('#gosteriCubuk');
  cubuk.style.transition = 'none'; cubuk.style.width = '0%'; void cubuk.offsetWidth;
  if (Gosteri.oynuyor) { cubuk.style.transition = `width ${sure}ms linear`; cubuk.style.width = '100%'; }
  clearTimeout(Gosteri.zaman);
  if (Gosteri.oynuyor) {
    // tek tur: son fotoğraftan sonra başa dönmez, biter
    Gosteri.zaman = setTimeout(() => {
      if (i + 1 >= Gosteri.liste.length) gosteriBittiGoster();
      else slaytGoster(i + 1);
    }, sure);
  }
}
function gosteriBittiGoster() {
  clearTimeout(Gosteri.zaman);
  Gosteri.oynuyor = false;
  if (Gosteri.ses) Gosteri.ses.pause();
  $('#gosteri').classList.remove('sakin');
  $('#gosteriBitti').classList.remove('hidden');
  const c = $('#gosteriCubuk'); c.style.transition = 'none'; c.style.width = '100%';
}
async function gosteriTekrarOynat() {
  $('#gosteriBitti').classList.add('hidden');
  Gosteri.oynuyor = true;
  $('#gosteriDur').textContent = '⏸️';
  if (Gosteri.ses) { Gosteri.ses.currentTime = 0; Gosteri.ses.play().catch(() => {}); }
  await slaytGoster(0);
  kontrolGizleSayaci();
}
function slaytIlerle(yon) {
  if (!Gosteri.liste.length) return;
  $('#gosteriBitti').classList.add('hidden');
  slaytGoster((Gosteri.sira + yon + Gosteri.liste.length) % Gosteri.liste.length);
}
function gosteriDurdur() {

async function pdfAktar() {
  const a = albumBul(); if (!a) return bildir(T('once_album'), 'hata');
  const fotolar = tumFotograflar(a);
  if (!fotolar.length) return bildir(T('foto_yok'), 'hata');
  try {
    bekle(T('pdf_hazirlaniyor', {i: 0, n: fotolar.length}));
    await kutuphaneGetir(KUTUPHANE.jspdf, 'jspdf');
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
    const G = 297, Y = 210, kenar = 14, alanG = G - kenar * 2;
    pdf.setFillColor(246, 246, 247); pdf.rect(0, 0, G, Y, 'F');
    const bas = yaziGorseli([a.ithaf || a.ad], {punto: a.ithaf ? 64 : 90, kalin: true, hiza: 'center'});
    pdf.addImage(bas.veri, 'PNG', kenar, 74, alanG, alanG * bas.y / bas.g);
    const alt = yaziGorseli([`${a.ithaf ? a.ad + ' · ' : ''}${kisaTarih(a.olusturuldu)}`], {punto: 38, hiza: 'center', renk: '#7A7480'});
    pdf.addImage(alt.veri, 'PNG', kenar, 118, alanG, alanG * alt.y / alt.g);

    let i = 0;
    for (const x of fotolar) {
      const resim = await blobVeriAdresi(await Depo.fotoBlob(a, x.grup, x.foto), 1500, .82);
      if (!resim) continue;
      i++; bekleMetin(T('pdf_hazirlaniyor', {i, n: fotolar.length}));
      pdf.addPage();
      pdf.setFillColor(23, 20, 27); pdf.rect(0, 0, G, Y, 'F');
      const grup = yaziGorseli(['🗂️ ' + x.grupAdi], {punto: 34, renk: '#E0699A', kalin: true, hiza: 'center'});
      pdf.addImage(grup.veri, 'PNG', kenar, 8, alanG, alanG * grup.y / grup.g);
      const alanY = 138, olcek = Math.min(alanG / resim.g, alanY / resim.y);
      const g = resim.g * olcek, y = resim.y * olcek;
      pdf.addImage(resim.veri, 'JPEG', (G - g) / 2, 22 + (alanY - y) / 2, g, y);
      let imlec = 168;
      const ust = altYazi(x.foto);
      if (ust) {
        const s = yaziGorseli([ust], {punto: 42, kalin: true, renk: '#FFFFFF', hiza: 'center'});
        const yh = alanG * s.y / s.g;
        pdf.addImage(s.veri, 'PNG', kenar, imlec, alanG, yh); imlec += yh + 2;
      }
      if (x.foto.not) {
        const s = yaziGorseli([x.foto.not], {punto: 32, renk: '#DED8E4', hiza: 'center'});
        let notG = alanG, notY = alanG * s.y / s.g;
        const kalan = Y - imlec - 6;
        if (notY > kalan) { notG = notG * kalan / notY; notY = kalan; }
        pdf.addImage(s.veri, 'PNG', (G - notG) / 2, imlec, notG, notY);
      }
    }
    const adDosya = temizAd(a.ad) + '.pdf';
    const blob = pdf.output('blob');
    indir(blob, adDosya);
    const klasore = await Depo.ciktiKaydet(adDosya, blob);
    bekleKapat(); bildir(T('pdf_indi'));
    if (klasore) bildir(T('exports_kaydedildi'), 'bilgi');
    paylasSor(blob, adDosya, 'application/pdf');
  } catch (e) { bekleKapat(); bildir(String(e.message || e), 'hata'); }
}

/* WhatsApp mp4 ister; destekleyen tarayıcıda mp4, yoksa webm kaydediyoruz */
function videoMime() {
  if (!window.MediaRecorder) return '';
  const adaylar = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4',
                   'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  return adaylar.find(m => { try { return MediaRecorder.isTypeSupported(m); } catch { return false; } }) || '';
}
function tuvaleYaz(x, metin, {y, punto, renk, kalin = false, maxG}) {
  x.font = `${kalin ? '700' : '400'} ${punto}px Nunito, Arial, sans-serif`;
  x.fillStyle = renk; x.textBaseline = 'top';
  const satirlar = [];
  let mevcut = '';
  metin.split(/\s+/).forEach(k => {
    const d = mevcut ? mevcut + ' ' + k : k;
    if (x.measureText(d).width > maxG && mevcut) { satirlar.push(mevcut); mevcut = k; } else mevcut = d;
  });
  satirlar.push(mevcut);
  const goster = satirlar.slice(0, 3);
  goster.forEach((s, i) => x.fillText(s, (1280 - x.measureText(s).width) / 2, y + i * punto * 1.25));
  return goster.length * punto * 1.25;
}
async function videoOlustur() {
  const a = albumBul(); if (!a) return bildir(T('once_album'), 'hata');
  const fotolar = tumFotograflar(a);
  if (!fotolar.length) return bildir(T('foto_yok'), 'hata');
  const mime = videoMime();
  if (!mime) return bildir(T('video_desteksiz'), 'hata');
  const uzanti = mime.indexOf('mp4') >= 0 ? '.mp4' : '.webm';

  const slaytSure = gosteriAyar(a).sure * 1000;
  const kapakSure = a.ithaf ? 3500 : 1500;
  const toplam = kapakSure + fotolar.length * slaytSure, sn = Math.round(toplam / 1000);
  if (!confirm(T('video_onay', {dk: Math.floor(sn / 60), sn: sn % 60}))) return;

  bekle(T('hazirlaniyor'), () => { durum.videoIptal = true; });
  durum.videoIptal = false;
  const resimler = [];
  for (const x of fotolar) {
    const adres = await Depo.fotoAdres(a, x.grup, x.foto);
    if (!adres) continue;
    const im = new Image(); im.src = adres;
    try { await im.decode(); } catch (e) {}
    resimler.push({im, f: x.foto, grupAdi: x.grupAdi});
  }
  if (!resimler.length) { bekleKapat(); return bildir(T('foto_yok'), 'hata'); }

  const tuval = document.createElement('canvas');
  tuval.width = 1280; tuval.height = 720;
  const x = tuval.getContext('2d');
  const akis = tuval.captureStream(30);

  let sesEl = null, sesBaglam = null;
  const muzik = await Depo.muzikAdres(a);
  if (muzik) {
    try {
      sesEl = new Audio(muzik); sesEl.loop = true; sesEl.crossOrigin = 'anonymous';
      sesBaglam = new (window.AudioContext || window.webkitAudioContext)();
      const kaynak = sesBaglam.createMediaElementSource(sesEl);
      const hedef = sesBaglam.createMediaStreamDestination();
      kaynak.connect(hedef);
      await sesEl.play();
      hedef.stream.getAudioTracks().forEach(t => akis.addTrack(t));
    } catch (e) { bildir(T('muzik_videoya_eklenemedi'), 'bilgi'); }
  }
  const kayitci = new MediaRecorder(akis, {mimeType: mime, videoBitsPerSecond: 4000000});
  const parcalar = [];
  kayitci.ondataavailable = e => { if (e.data.size) parcalar.push(e.data); };
  const bitti = new Promise(r => kayitci.onstop = r);
  kayitci.start(1000);            // veriyi saniyede bir topla, uzun kayıtlarda kayıp olmasın

  // kaydı izlemek için küçük önizleme: kullanıcı sekmeden ayrılmasın diye
  const onizlemeTuval = document.createElement('canvas');
  onizlemeTuval.className = 'w-64 max-w-full rounded-xl border border-cizgi';
  onizlemeTuval.width = 320; onizlemeTuval.height = 180;
  const onizlemeBg = onizlemeTuval.getContext('2d');
  $('#beklemeEk').innerHTML = `<p class="text-xs text-soluk mb-1">${T('video_onizleme')}</p>`;
  $('#beklemeEk').appendChild(onizlemeTuval);

  const ciz = (im, ustBosluk) => {
    const alanY = 720 - ustBosluk;
    const o = Math.min(1280 / im.naturalWidth, alanY / im.naturalHeight);
    const g = im.naturalWidth * o, y = im.naturalHeight * o;
    x.drawImage(im, (1280 - g) / 2, ustBosluk + (alanY - y) / 2, g, y);
  };
  const UST = 64;   // grup adı şeridi burada, fotoğrafın üstünde
  const baslangic = performance.now();
  await new Promise(cozum => {
    const zamanlayici = setInterval(() => {
      const gecen = performance.now() - baslangic;
      if (durum.videoIptal || gecen >= toplam) { clearInterval(zamanlayici); cozum(); return; }
      x.fillStyle = '#0D0A10'; x.fillRect(0, 0, 1280, 720);
      if (gecen < kapakSure) {
        x.globalAlpha = Math.min(1, gecen / 700);
        tuvaleYaz(x, a.ithaf || a.ad, {y: 300, punto: 54, renk: '#FFFFFF', kalin: true, maxG: 1080});
        tuvaleYaz(x, a.ithaf ? a.ad : kisaTarih(a.olusturuldu), {y: 430, punto: 30, renk: '#C6BFCE', maxG: 1080});
        x.globalAlpha = 1;
      } else {
        const idx = Math.min(resimler.length - 1, Math.floor((gecen - kapakSure) / slaytSure));
        const yerelMs = (gecen - kapakSure) % slaytSure;
        if (yerelMs < 700 && idx > 0) ciz(resimler[idx - 1].im, UST);
        x.globalAlpha = yerelMs < 700 ? yerelMs / 700 : 1;
        ciz(resimler[idx].im, UST);
        x.globalAlpha = 1;
        const o = resimler[idx];
        // üst şerit: grup adı
        x.fillStyle = 'rgba(13,10,16,.92)'; x.fillRect(0, 0, 1280, UST);
        x.font = '700 26px Nunito, Arial, sans-serif'; x.fillStyle = '#F0A8C6'; x.textBaseline = 'middle';
        x.fillText('🗂️ ' + o.grupAdi, 40, UST / 2);
        x.textBaseline = 'top';
        // alt şerit: başlık ve not
        const ust = altYazi(o.f);
        if (ust || o.f.not) {
          const perde = x.createLinearGradient(0, 500, 0, 720);
          perde.addColorStop(0, 'rgba(0,0,0,0)'); perde.addColorStop(1, 'rgba(0,0,0,.8)');
          x.fillStyle = perde; x.fillRect(0, 500, 1280, 220);
          let imlec = 580;
          if (ust) imlec += tuvaleYaz(x, ust, {y: imlec, punto: 34, renk: '#FFFFFF', kalin: true, maxG: 1100}) + 4;
          if (o.f.not) tuvaleYaz(x, o.f.not, {y: imlec, punto: 24, renk: '#DED8E4', maxG: 1100});
        }
      }
      onizlemeBg.drawImage(tuval, 0, 0, 320, 180);
      const kalan = Math.max(0, Math.round((toplam - gecen) / 1000));
      bekleMetin(T('video_kaydediliyor', {kalan: Math.floor(kalan / 60) + ':' + String(kalan % 60).padStart(2, '0')}));
    }, 1000 / 30);
  });
  $('#beklemeEk').innerHTML = '';
  kayitci.stop(); await bitti;
  if (sesEl) sesEl.pause();
  if (sesBaglam) { try { await sesBaglam.close(); } catch (e) {} }
  if (durum.videoIptal) { bekleKapat(); return bildir(T('video_iptal'), 'bilgi'); }

  const blob = new Blob(parcalar, {type: mime.split(';')[0]});
  const adDosya = temizAd(a.ad) + uzanti;
  indir(blob, adDosya);
  const klasore = await Depo.ciktiKaydet(adDosya, blob);
  bekleKapat(); bildir(T('video_indi'));
  if (klasore) bildir(T('exports_kaydedildi'), 'bilgi');
  paylasSor(blob, adDosya, mime.split(';')[0]);
}

/* --- Paylaşım: dosyayı WhatsApp/mail/mesaj olarak doğrudan gönderme --- */
let sonCikti = null;
function paylasilabilir(blob, ad, tip) {
  try { return !!(navigator.canShare && navigator.canShare({files: [new File([blob], ad, {type: tip})]})); }
  catch { return false; }
}
function paylasSor(blob, ad, tip) {
  sonCikti = {blob, ad, tip};
  const destek = paylasilabilir(blob, ad, tip);
  $('#paylasDosya').textContent = T('paylas_hazir', {ad});
  $('#paylasNot').textContent = destek ? T('paylas_var') : T('paylas_yok');
  $('#paylasGonder').classList.toggle('hidden', !destek);
  $('#paylasPencere').classList.remove('hidden');
}

async function yedekAl() {
  if (!durum.albumler.length) return bildir(T('yedek_yok'), 'hata');

    bekle(T('yedek_hazirlaniyor'));
    await kutuphaneGetir(KUTUPHANE.jszip, 'JSZip');
    const zip = new JSZip(), medyaListe = [];
    if (medyaDahil) {
      const hepsi = [];
      durum.albumler.forEach(a => tumFotograflar(a).forEach(x => hepsi.push({a, x})));
      let i = 0;
      for (const {a, x} of hepsi) {
        i++; bekleMetin(T('yedek_paketleniyor', {i, n: hepsi.length}));
        const blob = await Depo.fotoBlob(a, x.grup, x.foto);
        if (!blob) continue;
        const yol = `${a.klasor || slug(a.ad)}/${x.grup.klasor || slug(x.grup.ad)}/${x.foto.dosyaAdi || (x.foto.id + '.jpg')}`;
        zip.file('medya/' + yol, blob);
        medyaListe.push({yol, fotoId: x.foto.id, tip: blob.type || 'image/jpeg', boyut: blob.size});
      }
      for (const a of durum.albumler) {
        if (!a.muzik || a.muzik.dis) continue;
        const adres = await Depo.muzikAdres(a);
        if (!adres) continue;
        try {
          const blob = await (await fetch(adres)).blob();
          const yol = `${a.klasor || slug(a.ad)}/${a.muzik.dosyaAdi || 'music.mp3'}`;
          zip.file('medya/' + yol, blob);
          medyaListe.push({yol, muzikAlbum: a.id, tip: blob.type, boyut: blob.size});
        } catch (e) {}
      }
    }
    zip.file('manifest.json', JSON.stringify({
      uygulama: 'ani-defteri', surum: 4, tarih: Date.now(), medyaDahil,
      defterAdi: $('#defterAdi').textContent, dil, etiketler: durum.etiketler,
      albumler: durum.albumler, medya: medyaListe
    }, null, 2));
    zip.file(dil === 'tr' ? 'OKUBENI.txt' : 'READ-ME.txt', T('okubeni'));
    const blob = await zip.generateAsync({type: 'blob', compression: 'DEFLATE', compressionOptions: {level: 3}});
    indir(blob, `ani-defteri-${new Date().toISOString().slice(0, 10)}.album`);
    await ayarYaz('sonYedek', Date.now());
    bekleKapat(); yedekHatirlat();
    bildir(T('yedek_indi'));
  } catch (e) { bekleKapat(); bildir(String(e.message || e), 'hata'); }
}
async function yedekYukle() {
  const [dosya] = await dosyaSec('.album,.zip,application/zip', false);
  if (!dosya) return;
  if (!confirm(T('yedek_onay'))) return;
  try {
    bekle(T('yedek_okunuyor'));
    await kutuphaneGetir(KUTUPHANE.jszip, 'JSZip');
    const zip = await JSZip.loadAsync(dosya);
    const bilgiDosya = zip.file('manifest.json');
    if (!bilgiDosya) throw new Error(T('yedek_gecersiz'));
    const bilgi = JSON.parse(await bilgiDosya.async('string'));
    const albumler = bilgi.albumler || [];
    for (const a of albumler) {
      a.klasorEski = a.klasor || slug(a.ad);
      if (Depo.klasorAktif()) {
        a.klasor = await Depo.benzersizKlasor(Depo.kok, a.klasor || slug(a.ad));
        await Depo.kok.getDirectoryHandle(a.klasor, {create: true});
        for (const g of a.gruplar) { g.klasor = g.klasor || slug(g.ad); await Depo.grupDizin(a, g, true); }
      }
    }
    let i = 0;
    for (const m of (bilgi.medya || [])) {
      const girdi = zip.file('medya/' + m.yol);
      if (!girdi) continue;
      i++; bekleMetin(T('yedek_paketleniyor', {i, n: bilgi.medya.length}));
      const blob = await girdi.async('blob');
      const parca = m.yol.split('/');
      const albumKlasor = parca[0], dosyaAdi = parca[parca.length - 1];
      const a = albumler.find(z => z.klasorEski === albumKlasor) || albumler.find(z => z.klasor === albumKlasor) || albumler[0];
      if (!a) continue;
      if (m.muzikAlbum || parca.length === 2) {
        const eskiAd = a.muzik && a.muzik.ad;
        a.muzik = await Depo.muzikYaz(a, new File([blob], dosyaAdi, {type: m.tip}));
        if (eskiAd) a.muzik.ad = eskiAd;
        continue;
      }
      const g = a.gruplar.find(z => z.klasor === parca[1]) || a.gruplar.find(z => slug(z.ad) === parca[1]) || a.gruplar[0];
      const f = g && g.fotograflar.find(z => z.id === m.fotoId);
      if (!g || !f) continue;
      Object.assign(f, await Depo.fotoYaz(a, g, new File([blob], dosyaAdi, {type: m.tip})));
    }
    for (const a of albumler) {
      delete a.klasorEski;
      const j = durum.albumler.findIndex(x => x.id === a.id);
      if (j >= 0) durum.albumler[j] = a; else durum.albumler.push(a);
      await Depo.albumYaz(a);
    }
    for (const e of (bilgi.etiketler || [])) {
      if (!durum.etiketler.some(x => x.id === e.id || kucuk(x.ad) === kucuk(e.ad))) durum.etiketler.push(e);
    }
    await ayarYaz('etiketler', durum.etiketler);
    durum.albumler.sort((a, b) => a.olusturuldu - b.olusturuldu);
    if (!albumBul() && durum.albumler[0]) durum.seciliAlbum = durum.albumler[0].id;
    bekleKapat();
    durum.ekran = 'liste'; ekranGoster(); etiketFiltreCiz(); listeCiz(); onizlemeCiz();
    bildir(T('yedek_geri'));
  } catch (e) { bekleKapat(); bildir(String(e.message || e), 'hata'); }
}
async function yedekHatirlat() {
  const son = await ayarOku('sonYedek', null);
  const kutu = $('#hatirlatici'), metin = $('#hatirlaticiMetin');
  if (!durum.albumler.length) { kutu.classList.add('hidden'); return; }
  if (!son) { metin.innerHTML = T('hatirlat_ilk'); kutu.classList.remove('hidden'); return; }
  const gun = Math.floor((Date.now() - son) / 86400000);
  if (gun >= 7) { metin.innerHTML = T('hatirlat_gun', {n: gun}); kutu.classList.remove('hidden'); }
  else kutu.classList.add('hidden');
}

/* ---------- 14) OLAYLAR -------------------------------------------------- */
function sekmeAc(ad) {
  durum.sekme = ad;
  $$('[role="tab"]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.sekme === ad)));
  $$('[data-panel]').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== ad));
  if (ad === 'onizleme') onizlemeCiz();
  if (ad === 'tasarim' && durum.ekran === 'liste') listeCiz();
}
$$('[role="tab"]').forEach(b => b.onclick = () => sekmeAc(b.dataset.sekme));
$('#btnMenu').onclick = (e) => { e.stopPropagation(); menuAc(); };
document.addEventListener('click', (e) => {
  const p = $('#menuPanel');
  if (!p.classList.contains('hidden') && !p.contains(e.target) && e.target !== $('#btnMenu')) menuAc(false);
});
$('#btnYeniAlbum').onclick = yeniAlbum;
$('#btnGeri').onclick = listeyeDon;
$('#albumSirala').addEventListener('change', listeCiz);
$('#etiketFiltre').addEventListener('change', (e) => { durum.filtre = e.target.value || null; listeCiz(); });
$$('[data-gorunum]').forEach(b => b.onclick = async () => { durum.gorunum = b.dataset.gorunum; await ayarYaz('gorunum', durum.gorunum); listeCiz(); });
$('#btnDefterAdi').onclick = async () => {
  const ad = await metinSor({baslik: T('defter_baslik'), aciklama: T('defter_aciklama'),
    deger: $('#defterAdi').textContent, ipucu: T('ornek_defter'), dogrula: (v) => !v ? T('ad_gerekli') : null});
  if (!ad) return;
  $('#defterAdi').textContent = ad; await ayarYaz('defterAdi', ad);
};
$('#fotoKapat').onclick = fotoKapat;
$('#fotoKaydet').onclick = fotoKaydet;
$('#fotoSil').onclick = fotoSilAksiyon;
$('#fotoKapak').onclick = fotoKapakYap;
$('#fotoPencere').addEventListener('click', e => { if (e.target.id === 'fotoPencere') fotoKapat(); });
$('#muzikKapat').onclick = muzikPencereKapat;
$('#muzikDosya').onclick = muzikDosyadan;
$('#muzikPencere').addEventListener('click', e => { if (e.target.id === 'muzikPencere') muzikPencereKapat(); });
$('#onizlemeAlbum').addEventListener('change', async e => {
  durum.seciliAlbum = e.target.value;
  await ayarYaz('sonAlbum', durum.seciliAlbum);
  onizlemeCiz();
});
$('#btnGosteriBaslat').onclick = gosteriBaslat;
$('#gosteriKapat').onclick = gosteriKapat;
$('#gosteriGeri').onclick = () => slaytIlerle(-1);
$('#gosteriIleri').onclick = () => slaytIlerle(1);
$('#gosteriDur').onclick = gosteriDurdur;
$('#gosteriEkran').onclick = tamEkranDegistir;
$('#gosteriTekrar').onclick = gosteriTekrarOynat;
$('#gosteriBittiKapat').onclick = gosteriKapat;
$('#paylasKapat').onclick = () => $('#paylasPencere').classList.add('hidden');
$('#paylasGonder').onclick = async () => {
  if (!sonCikti) return;
  try {
    await navigator.share({files: [new File([sonCikti.blob], sonCikti.ad, {type: sonCikti.tip})], title: sonCikti.ad});
    $('#paylasPencere').classList.add('hidden');
  } catch (e) { bildir(T('paylas_iptal'), 'bilgi'); }
};
$('#etiketSilIptal').onclick = () => $('#etiketSilPencere').classList.add('hidden');
['mousemove', 'touchstart', 'click'].forEach(o => $('#gosteri').addEventListener(o, kontrolGizleSayaci));
$('#btnPptx').onclick = pptxAktar;
$('#btnPdf').onclick = pdfAktar;
$('#btnVideo').onclick = videoOlustur;
$('#beklemeIptal').onclick = () => { if (iptalIsteme) iptalIsteme(); };
document.addEventListener('keydown', e => {
  if (!$('#gosteri').classList.contains('hidden')) {
    if (e.key === 'Escape') gosteriKapat();
    if (e.key === 'ArrowRight') slaytIlerle(1);
    if (e.key === 'ArrowLeft') slaytIlerle(-1);
    if (e.key === ' ') { e.preventDefault(); gosteriDurdur(); }
    return;
  }
  if (e.key === 'Escape' && !$('#fotoPencere').classList.contains('hidden')) fotoKapat();
});

baslat().catch(e => { console.error(e); bildir(String(e.message || e), 'hata'); });
</script>
